<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>选点</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e8ecef;
    font-family:-apple-system,"Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;}
  #map{position:absolute;inset:0;touch-action:none;}
  #map img{position:absolute;pointer-events:none;-webkit-user-drag:none;}
  /* 中心十字标记 */
  #pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-92%);z-index:10;pointer-events:none;
    text-align:center;}
  #pin .dot{width:14px;height:14px;border-radius:50% 50% 50% 0;background:#e53935;
    transform:rotate(-45deg);margin:0 auto;box-shadow:0 2px 6px rgba(0,0,0,.4);}
  #pin .lbl{margin-top:3px;font-size:11px;color:#e53935;background:rgba(255,255,255,.9);
    border-radius:4px;padding:1px 6px;white-space:nowrap;}
  /* 顶部坐标条 */
  #bar{position:absolute;top:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.95);
    padding:8px 12px;font-size:13px;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.15);}
  #bar b{color:#e53935;}
  /* 右下缩放按钮 */
  #zoom{position:absolute;right:12px;bottom:96px;z-index:20;display:flex;flex-direction:column;gap:10px;}
  #zoom button{width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:#333;
    font-size:22px;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.25);}
  /* 底部按钮 */
  #foot{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:12px;
    background:linear-gradient(transparent,rgba(0,0,0,.06));display:flex;gap:10px;}
  #foot button{flex:1;height:46px;border:none;border-radius:8px;font-size:16px;}
  #ok{background:#1a73e8;color:#fff;}
  #back{background:#fff;color:#333;}
</style>
</head>
<body>
<div id="map"></div>
<div id="pin"><div class="dot"></div><div class="lbl">目标位置</div></div>
<div id="bar" style="padding-bottom:6px;">
  <div id="searchRow" style="display:flex;gap:6px;margin-bottom:6px;">
    <input id="qbox" placeholder="搜索地址，如：北京天安门 / 上海市黄浦区"
      style="flex:1;height:34px;font-size:13px;padding:0 8px;border:1px solid #ddd;border-radius:6px;outline:none;background:#fff;">
    <button id="qgo" style="width:52px;height:34px;border:none;border-radius:6px;background:#1a73e8;color:#fff;font-size:13px;">搜索</button>
  </div>
  <div id="addrRow" style="font-size:12px;color:#555;min-height:16px;">📍 <span id="addr">加载中…</span></div>
  <div>GCJ坐标：<b id="co">--</b></div>
</div>
<div id="zoom"><button id="zi">＋</button><button id="zo">－</button></div>
<div id="foot"><button id="back">返回</button><button id="ok">选定此位置</button></div>
<div id="dbg" style="position:absolute;left:8px;bottom:64px;z-index:20;font-size:11px;color:#888;background:rgba(255,255,255,.8);padding:2px 6px;border-radius:4px;"></div>
<script>
// ---------- WGS84 -> GCJ02（高德瓦片是 GCJ-02；输入查询参数按 WGS 处理） ----------
function wgs2gcj(lat, lng) {
  var a=6378245.0, ee=0.00669342162296594323;
  function tL(l){return l<72.004||l>137.8347} function tB(b){return b<0.8293||b>55.8271}
  function tX(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=y>40?0:(y-40)/3*4e-6;return r}
  function tY(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=20*Math.sin(y*Math.PI)*2/3;return r}
  if (tL(lng)||tB(lat)) return [lat,lng];
  var dLat=tX(lng-105,lat-35), dLng=tY(lng-105,lat-35);
  var radLat=lat/180*Math.PI, magic=Math.sin(radLat);
  magic=1-ee*magic*magic; var sqrtMagic=Math.sqrt(magic);
  dLat=(dLat*180)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
  dLng=(dLng*180)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
  return [lat+dLat, lng+dLng];
}
// ---------- 墨卡托工具 ----------
var PI=Math.PI, D2R=PI/180;
function ll2px(lat,lng,z){var s=256*Math.pow(2,z);
  return [ (lng+180)/360*s, (0.5-Math.log(Math.tan(PI/4+lat*D2R/2))/PI)/2*s ];}
function px2ll(x,y,z){var s=256*Math.pow(2,z);
  var lng=x/s*360-180, n=PI-2*PI*y/s, lat=180/PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
  return [lat,lng];}
// ---------- 状态 ----------
var q={}; location.search.slice(1).split('&').forEach(function(p){
  var kv=p.split('='); q[kv[0]]=decodeURIComponent(kv[1]||''); });
var gcj=wgs2gcj(parseFloat(q.lat)||31.2304, parseFloat(q.lng)||121.4737);
var z=16, cx, cy;                       // cx,cy = 当前中心的世界像素坐标
(function(){var p=ll2px(gcj[0],gcj[1],z); cx=p[0]; cy=p[1];})();
var map=document.getElementById('map'), co=document.getElementById('co');
var tiles={};                           // key -> img
// ---------- 高德官方 JS API 优先（用户填了 Key 时） ----------
var AMAP_KEY=q.key||'', AMAP_SEC=q.sec||'';
var amapReady=false, amapMap=null, amapLock=false;
if (AMAP_KEY) {
  window._AMapSecurityConfig = AMAP_SEC ? { securityJsCode: AMAP_SEC } : undefined;
  var s=document.createElement('script');
  s.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(AMAP_KEY);
  s.onload=function(){
    try{
      amapMap=new AMap.Map('amap',{zoom:z,center:[gcj[1],gcj[0]],resizeEnable:true,
        doubleClickZoom:true,dragEnable:true,zoomEnable:true});
      // 跟随中心的选点标记：拖动/缩放时实时移到新中心，红针视觉永不丢
      window._pinMarker=new AMap.Marker({position:[gcj[1],gcj[0]],
        content:'<div style="width:14px;height:14px;border-radius:50% 50% 50% 0;background:#e53935;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4);margin:0 auto;"></div><div style="margin-top:3px;font-size:11px;color:#e53935;background:rgba(255,255,255,.9);border-radius:4px;padding:1px 6px;white-space:nowrap;text-align:center;">目标位置</div>',
        anchor:'bottom-center', title:'目标位置'});
      amapMap.add(window._pinMarker);
      amapReady=true;
      map.style.display='none'; document.getElementById('pin').style.display='none';
      // 拖动/缩放中实时把红针钉在屏幕中心 = 你选的位置
      var sync=function(){
        var c=amapMap.getCenter();
        window._pinMarker.setPosition([c.getLng(),c.getLat()]);
        co.textContent=c.getLat().toFixed(6)+', '+c.getLng().toFixed(6);
      };
      amapMap.on('mapmove',sync);
      amapMap.on('zoomend',sync);
      amapMap.on('moveend',sync);
      amapMap.on('dragging',sync);
      sync();
      // 加载官方插件：搜索 + 逆地理
      AMap.plugin(['AMap.PlaceSearch','AMap.Geocoder','AMap.Geolocation'], function(){
        window._geo = new AMap.Geocoder({});
        window._search = new AMap.PlaceSearch({city:'全国', pageSize:1});
        window._loc = new AMap.Geolocation({enableHighAccuracy:true,timeout:10000});
        reverseGeocode(gcj[0], gcj[1]);
      });
    }catch(e){ map.style.display=''; amapReady=false; }
  };
  s.onerror=function(){ amapReady=false; map.style.display=''; };
  document.head.appendChild(s);
}
// 官方地图模式下取中心坐标；否则走自研瓦片
function centerGCJ(){
  if(amapReady&&amapMap){var c=amapMap.getCenter();return [c.getLat(),c.getLng()];}
  return px2ll(cx,cy,z);
}
// ---------- 逆地理：坐标 → 文字地址（普通人看得懂） ----------
var _revTimer=null;
function reverseGeocode(lat,lng){
  var el=document.getElementById('addr');
  if(!amapReady||!window._geo){ el.textContent=lat.toFixed(4)+', '+lng.toFixed(4)+' 附近'; return; }
  clearTimeout(_revTimer);
  el.textContent='定位地址中…';
  _revTimer=setTimeout(function(){
    window._geo.getAddress([lng,lat],function(status,result){
      if(status==='complete'&&result.regeocode){
        var a=result.regeocode.formattedAddress||'';
        var comp=result.regeocode.addressComponent||{};
        var brief=(comp.province||'')+(comp.city&&comp.city!==comp.province?comp.city:'')+(comp.district||'');
        el.textContent=a?brief+' · '+a:lat.toFixed(4)+', '+lng.toFixed(4);
      } else { el.textContent=lat.toFixed(4)+', '+lng.toFixed(4)+' 附近'; }
    });
  },400);
}
// ---------- 地址搜索：飞过去 ----------
function doSearch(){
  var kw=document.getElementById('qbox').value.trim();
  if(!kw){ return; }
  if(amapReady&&window._search){
    document.getElementById('addr').textContent='搜索中…';
    window._search.search(kw,function(status,result){
      if(status==='complete'&&result.poiList&&result.poiList.pois&&result.poiList.pois.length){
        var poi=result.poiList.pois[0];
        var ll=poi.location;
        amapMap.setZoomAndCenter(16,[ll.getLng(),ll.getLat()]);
        document.getElementById('qbox').blur();
      } else {
        document.getElementById('addr').textContent='没搜到「'+kw+'」，试试更完整的地址';
      }
    });
  } else if (AMAP_KEY && AMAP_SEC){
    // SDK 未就绪，退化为 Web 服务 API（同 Key 可用）
    fetch('https://restapi.amap.com/v3/place/text?key='+encodeURIComponent(AMAP_KEY)
      +'&keywords='+encodeURIComponent(kw)+'&city=&offset=1&page=1')
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.pois&&j.pois.length){
          var ll=j.pois[0].location.split(',');
          moveTo(parseFloat(ll[1]),parseFloat(ll[0]));
          document.getElementById('qbox').blur();
        } else {
          document.getElementById('addr').textContent='没搜到「'+kw+'」';
        }
      }).catch(function(){document.getElementById('addr').textContent='搜索失败，检查网络';});
  } else {
    document.getElementById('addr').textContent='搜索需要高德Key和安全密钥（回主页填写）';
  }
}
document.getElementById('qgo').onclick=doSearch;
document.getElementById('qbox').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
// 自研渲染容器（官方模式建立后隐藏）
var amapDiv=null;
function ensureAmapDiv(){ if(!amapDiv){ amapDiv=document.createElement('div');
  amapDiv.id='amap'; amapDiv.style.cssText='position:absolute;inset:0;z-index:1;';
  map.parentNode.insertBefore(amapDiv,map);} return amapDiv; }
if (AMAP_KEY) ensureAmapDiv();
// ---------- 瓦片源：多源并发 + 自动切换 ----------
// src0 高德街道 / src1 腾讯街道（GCJ 坐标系同源兼容）/ src2 高德卫星
var SRCS=[
  function(x,y,z){return 'https://webrd0'+(1+(x+y)%4)+'.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x='+x+'&y='+y+'&z='+z;},
  function(x,y,z){return 'https://map.gtimg.com/realtimerender?z='+z+'&x='+x+'&y='+(-y-1)+'&style=0&type=vector&width=256&height=256';},
  function(x,y,z){return 'https://wprd0'+(1+(x+y)%4)+'.is.autonavi.com/appmaptile?x='+x+'&y='+y+'&z='+z+'&lang=zh_cn&size=1&scl=1&style=6';}
];
var srcIdx=0, failCount=0;
// ---------- 渲染 ----------
function render(){
  var w=innerWidth, h=innerHeight;
  var ox=cx-w/2, oy=cy-h/2;
  var tx0=Math.floor(ox/256), ty0=Math.floor(oy/256);
  var tx1=Math.floor((ox+w)/256), ty1=Math.floor((oy+h)/256);
  var n=Math.pow(2,z), alive={};
  for(var X=tx0;X<=tx1;X++)for(var Y=ty0;Y<=ty1;Y++){
    if(Y<0||Y>=n)continue;
    var wx=((X%n)+n)%n, key=z+'/'+X+'/'+Y; alive[key]=1;
    var img=tiles[key];
    if(!img){
      img=document.createElement('img');
      img.src=SRCS[srcIdx](wx,Y,z);
      img.onerror=function(){
        failCount++;
        // 同源重试 2 次仍失败 → 全局切换下一个瓦片源并清空重画
        if(this.dataset.retried==='1'){
          if(failCount>6 && srcIdx<SRCS.length-1){ srcIdx++; failCount=0;
            for(var k in tiles){map.removeChild(tiles[k]);} tiles={}; render(); }
          return;
        }
        this.dataset.retried='1';
        var t=this; setTimeout(function(){ t.src=SRCS[srcIdx](+t.dataset.x, +t.dataset.y, z); },600);
      };
      img.dataset.x=wx; img.dataset.y=Y;
      tiles[key]=img; map.appendChild(img);
    }
    img.style.left=(X*256-ox)+'px'; img.style.top=(Y*256-oy)+'px';
  }
  for(var k in tiles)if(!alive[k]){map.removeChild(tiles[k]);delete tiles[k];}
  var c=px2ll(cx,cy,z);
  co.textContent=c[0].toFixed(6)+', '+c[1].toFixed(6);
  if(!amapReady) reverseGeocode(c[0], c[1]);
}
// ---------- 拖动（鼠标+触摸统一 pointer） ----------
var drag=null;
map.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY};map.setPointerCapture(e.pointerId);});
map.addEventListener('pointermove',function(e){if(!drag)return;
  cx-=e.clientX-drag.x; cy-=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY}; render();});
map.addEventListener('pointerup',function(){drag=null;});
map.addEventListener('wheel',function(e){e.preventDefault();
  z=e.deltaY<0?Math.min(19,z+1):Math.max(3,z-1);
  var p=ll2px(px2ll(cx,cy,z)[0],px2ll(cx,cy,z)[1],z);cx=p[0];cy=p[1];render();},{passive:false});
document.getElementById('zi').onclick=function(){
  if(amapReady&&amapMap){ amapMap.setZoom(Math.min(19,amapMap.getZoom()+1)); return; }
  z=Math.min(19,z+1);render();};
document.getElementById('zo').onclick=function(){
  if(amapReady&&amapMap){ amapMap.setZoom(Math.max(3,amapMap.getZoom()-1)); return; }
  z=Math.max(3,z-1);render();};
document.getElementById('back').onclick=function(){Android.mapPick('','');};
document.getElementById('ok').onclick=function(){
  var c=centerGCJ();
  var a='';
  try{ a=document.getElementById('addr').textContent.replace(/^📍 /,'').replace(/^定位地址中…$/,''); }catch(e){}
  Android.mapPick(c[0].toFixed(6), c[1].toFixed(6), a);
};
// 原生「我的位置」按钮入口：WGS84 输入 → 转 GCJ → 居中
function moveTo(wgsLat, wgsLng){
  var g=wgs2gcj(wgsLat, wgsLng);
  if(amapReady&&amapMap){ amapMap.setZoomAndCenter(16,[g[1],g[0]]); return; }
  var p=ll2px(g[0], g[1], z);
  cx=p[0]; cy=p[1];
  if(z<15){ z=16; p=ll2px(g[0], g[1], z); cx=p[0]; cy=p[1]; }
  render();
}
addEventListener('resize',render);
if(!AMAP_KEY) render();   // 官方模式时自研层保持隐藏，等 onload 挂 AMap
</script>
</body>
</html>

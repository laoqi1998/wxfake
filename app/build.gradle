apply from: 'signing.gradle'

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wxfake'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.wxfake'
        minSdk 33
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 若 api.xposed.info 拉取失败：
    // 1) 手动下载 XposedBridgeApi-82.jar 放到 app/libs/
    // 2) 改用: compileOnly files('libs/XposedBridgeApi-82.jar')
    compileOnly 'de.robv.android.xposed:api:82'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wxfake'
    compileSdk 34

    signingConfigs {
        gh {
            storeFile rootProject.file("keystore.jks")
            storePassword "wxfake123456"
            keyAlias "wxfake"
            keyPassword "wxfake123456"
        }
    }

    defaultConfig {
        applicationId 'com.example.wxfake'
        minSdk 33
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gh
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.gh
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}

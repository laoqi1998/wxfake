name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore persistent signing key
        uses: actions/cache@v4
        with:
          path: keystore.jks
          key: wxfake-keystore-v1

      - name: Create keystore if missing
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias wxfake \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass wxfake123456 -keypass wxfake123456 \
              -dname "CN=WxFake, OU=Dev, O=Dev, L=City, ST=State, C=CN"
            echo "created new keystore"
          else
            echo "keystore restored from cache"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build signed APK
        env:
          STORE_FILE: keystore.jks
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WxFakeLocation-apk
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        id: key
        run: |
          if [ -f keystore.jks ]; then
            echo "Using committed keystore"
          else
            keytool -genkeypair -v -keystore keystore.jks -alias wxfake \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass wxfake123456 -keypass wxfake123456 \
              -dname "CN=WxFake, OU=Dev, O=Dev, L=City, ST=State, C=CN"
            git config user.name "sign-bot"
            git config user.email "sign-bot@users.noreply.github.com"
            git add keystore.jks
            git commit -m "chore: persist signing keystore" || true
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list_installed || true

      - name: Build signed release APK
        env:
          KS_PASS: wxfake123456
        run: |
          cat > signing.gradle <<'EOF'
          android.signingConfigs.create("gh") {
              storeFile rootProject.file("keystore.jks")
              storePassword "wxfake123456"
              keyAlias "wxfake"
              keyPassword "wxfake123456"
              signingConfig = it
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.gh
          android.buildTypes.debug.signingConfig = android.signingConfigs.gh
          EOF
          sed -i 's|^apply plugin|apply from: "signing.gradle"\napply plugin|' app/build.gradle
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WxFakeLocation-apk
          path: app/build/outputs/apk/debug/app-debug.apk
